}
function hydrateImages(root, files){
  root.querySelectorAll('[data-img]').forEach(async b => {
    const id = b.dataset.img;
    let data = imgCache.get(id);
    if(!data){ const f = await store.getFile(id); data = f?.data; if(data) imgCache.set(id,data); }
    if(data && b.isConnected){ b.classList.remove('loading'); b.innerHTML = `<img src="${data}" alt="Anexo">`; }
  });
  root.querySelectorAll('[data-dl]').forEach(b => { b.onclick = () => { const meta = (files||[]).find(a=>a.id===b.dataset.dl) || {id:b.dataset.dl}; saveAttachment(meta); }; });
}

/* ───────── usuários (somente administradora) ───────── */
function openUsers(){
  if(!isAdmin()) return;
  let list = [];
  const o = layer(`<div class="m-head"><h2>Usuários</h2><div class="meta">Quem pode entrar no painel de atendimento.</div><button class="x" aria-label="Fechar">${ic('x')}</button></div>
  <div class="m-body" id="usrBody"></div><div class="m-foot"><button class="btn" data-c>Fechar</button></div>`);
  let unsub = null;
  o._close = () => { unsub?.(); o.remove(); };
  o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  const body = $('#usrBody', o);
  const all = () => [...list].sort((a,b) => (a.role==='admin'?0:1) - (b.role==='admin'?0:1) || a.name.localeCompare(b.name,'pt'));
  const draw = () => {
    const keep = { n:$('#un',body)?.value||'', u:$('#uu',body)?.value||'', r:$('#ur',body)?.value||'atendente' };
    body.innerHTML = `<div class="cat-sec"><h3>Cadastrados</h3><ul class="cat-list" style="max-height:230px">
      ${all().map(u => `<li><div><div style="font-weight:500">${esc(titleName(u.name))}${u.user===me.user?' <span class="note">(você)</span>':''}</div><div class="note" style="margin:0">${esc(u.user)} · ${ROLE_LABEL[u.role]||'Atendente'} · ${u.disabled ? '<b style="color:var(--danger,#B42318)">Desativado</b>' : 'Ativo'}</div></div>
        <div><button data-pw="${esc(u.user)}" style="color:var(--blue-text)">Nova senha</button>${u.user===me.user ? '' : `<button data-tg="${esc(u.user)}" style="color:var(--blue-text)">${u.disabled ? 'Reativar' : 'Desativar'}</button><button data-rm="${esc(u.user)}">Remover</button>`}</div></li>`).join('')}
      </ul></div>
      <div class="cat-sec"><h3>Cadastrar usuário</h3>
      <form id="uf" autocomplete="off">
        <div class="two"><div class="field"><label for="un">Nome completo</label><input class="inp" id="un" required maxlength="80" value="${esc(keep.n)}"></div>
        <div class="field"><label for="uu">Usuário</label><input class="inp" id="uu" required maxlength="30" autocapitalize="none" spellcheck="false" placeholder="ex.: joao.silva" value="${esc(keep.u)}"></div></div>
        <div class="two"><div class="field"><label for="up">Senha inicial</label><input class="inp" id="up" type="password" required minlength="6" maxlength="60" autocomplete="new-password"></div>
        <div class="field"><label for="ur">Perfil</label><select class="inp" id="ur"><option value="atendente" ${keep.r==='atendente'?'selected':''}>Atendente</option><option value="admin" ${keep.r==='admin'?'selected':''}>Administradora</option></select></div></div>
        <div class="err" id="ue" role="alert"></div>
        <button class="btn primary" type="submit">Cadastrar usuário</button>
        <p class="note">Atendentes registram e respondem chamados. Só a administradora cadastra usuários, assuntos e cidades, reabre e exclui chamados.</p>
      </form></div>`;
    $('#uf',body).onsubmit = async e => {
      e.preventDefault(); const err = $('#ue',body); err.textContent = '';
      const name = $('#un',body).value.trim().replace(/\s+/g,' '), user = $('#uu',body).value.trim().toLowerCase(), pass = $('#up',body).value, role = $('#ur',body).value;
      if(!name){ err.textContent = 'Informe o nome completo.'; return; }
      if(!/^[a-z][a-z0-9._-]{2,29}$/.test(user)){ err.textContent = 'Usuário: de 3 a 30 caracteres, começando por letra. Use letras minúsculas, números, ponto, hífen ou sublinhado.'; return; }
      if(pass.length < 6){ err.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
      if(list.some(x => x.user === user)){ err.textContent = 'Este usuário já existe.'; return; }
      try{
        await store.createUser({ user, name, role, password: pass });
        toast(`Usuário ${user} cadastrado.`); keep.n = keep.u = ''; $('#un',body).value = ''; $('#uu',body).value = ''; $('#up',body).value = '';
      }catch(e){ err.textContent = e?.message || 'Não foi possível cadastrar. Tente de novo.'; }
    };
    body.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => {
      const u = b.dataset.tg, rec = list.find(x => x.user === u); if(!rec) return;
      const off = !rec.disabled;
      confirmClick(b, off ? 'Desativar?' : 'Reativar?', async () => {
        try{ await store.toggleUser(rec, off); toast(off ? `Perfil ${u} desativado.` : `Perfil ${u} reativado.`); }
        catch(_){ toast('Não foi possível alterar o perfil.'); }
      });
    });
    body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => confirmClick(b, 'Confirmar?', async () => {
      try{ await store.delUser(b.dataset.rm); toast('Usuário removido.'); }catch(e){ toast(e?.message || 'Não foi possível remover.'); }
    }));
    body.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => {
      const u = b.dataset.pw, rec = list.find(x => x.user === u); if(!rec) return;
      const li = b.closest('li'); const div = li.lastElementChild;
      div.innerHTML = `<form class="cat-add" style="min-width:210px"><input class="inp" type="password" minlength="6" maxlength="60" placeholder="Nova senha" aria-label="Nova senha de ${esc(u)}" autocomplete="new-password" required><button class="btn" type="submit">Salvar</button></form>`;
      const fm = div.firstElementChild; fm.querySelector('input').focus();
      fm.onsubmit = async ev => { ev.preventDefault(); const p = fm.querySelector('input').value; if(p.length < 6){ toast('A senha precisa ter pelo menos 6 caracteres.'); return; }
        try{ await store.setPassword(u, p); toast('Senha alterada.'); draw(); }catch(e){ toast(e?.message || 'Não foi possível alterar a senha.'); } };
    });
  };
  unsub = store.watchUsers(l => { list = l.map(({id,...r}) => r); if(!body.contains(document.activeElement) || !document.activeElement.matches('input')) draw(); });
  if(!list.length) draw();
}

/* ───────── cadastros (somente administradora) ───────── */
function openCatalog(){
  if(!isAdmin()) return;
  const o = layer(`<div class="m-head"><h2>Cadastros</h2><div class="meta">Os atendentes escolhem nestas listas ao registrar um chamado.</div><button class="x" aria-label="Fechar">${ic('x')}</button></div>
  <div class="m-body" id="catBody"></div><div class="m-foot"><button class="btn" data-c>Fechar</button></div>`);
  o._close = () => o.remove(); o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  renderCatalog();
}
function renderCatalog(){
  const body = $('#catBody'); if(!body) return;
  const ufOpts = cur => `<option value="">Estado…</option>` + UF_LIST.slice().sort().map(u => `<option value="${u}" ${u===cur?'selected':''}>${u}</option>`).join('');
  const sec = (key, title, ph) => `<div class="cat-sec"><h3>${title}</h3>
    <ul class="cat-list">${catalog[key].length ? catalog[key].map((v,i)=>`<li><span>${esc(v)}</span><span class="city-uf">${key==='cities' ? `<select class="inp" data-uf="${i}" aria-label="Estado de ${esc(v)}">${ufOpts((catalog.cityUF||{})[v]||'')}</select>` : ''}<button data-k="${key}" data-i="${i}">Remover</button></span></li>`).join('') : '<li class="none">Nenhum item cadastrado.</li>'}</ul>
    <form class="cat-add" data-k="${key}"><input class="inp" placeholder="${ph}" maxlength="80" aria-label="Novo item em ${title}">${key==='cities' ? `<select class="inp" id="newUF" style="width:auto" aria-label="Estado da nova cidade">${ufOpts('')}</select>` : ''}<button class="btn" type="submit">Adicionar</button></form></div>`;
  body.innerHTML = sec('types','Tipos','Ex.: Reclamação') + sec('subjects','Assuntos','Ex.: Ônibus quebrado') + sec('cities','Cidades','Nome da cidade') + `<p class="note" style="padding:0 20px 8px">Remover um item não altera chamados já registrados.</p>`;
  const save = async next => { try{ await store.saveCatalog(next); }catch(_){ toast('Não foi possível salvar. Tente de novo.'); } };
  body.querySelectorAll('form.cat-add').forEach(fm => fm.onsubmit = e => {
    e.preventDefault(); const inp = fm.querySelector('input'), v = inp.value.trim(), k = fm.dataset.k;
    if(!v) return;
    if(catalog[k].some(x => x.toLowerCase() === v.toLowerCase())){ toast('Este item já está cadastrado.'); return; }
    const next = { ...catalog, [k]: [...catalog[k], v] };
    if(k === 'cities'){ const uf = $('#newUF', body).value; if(!uf){ toast('Escolha o estado da cidade (é usado no mapa do Panorama).'); return; } next.cityUF = { ...(catalog.cityUF||{}), [v]: uf }; }
    inp.value = ''; save(next);
  });
  body.querySelectorAll('select[data-uf]').forEach(sel => sel.onchange = () => { const v = catalog.cities[+sel.dataset.uf]; const m = { ...(catalog.cityUF||{}) }; if(sel.value) m[v] = sel.value; else delete m[v]; save({ ...catalog, cityUF:m }); });
  body.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => confirmClick(b, 'Confirmar?', () => {
    const k = b.dataset.k, removed = catalog[k][+b.dataset.i], next = { ...catalog, [k]: catalog[k].filter((_,i) => i !== +b.dataset.i) };
    if(k === 'cities'){ const m = { ...(catalog.cityUF||{}) }; delete m[removed]; next.cityUF = m; }
    save(next);
  }));
}

/* ───────── novo chamado ───────── */
function openNew(){
  const pending = [];
  const o = layer(`<div class="m-head"><h2>Novo chamado</h2><div class="meta">O protocolo é gerado ao registrar.</div><button class="x" aria-label="Fechar">${ic('x')}</button></div>
  <form id="nf" class="" style="display:flex;flex-direction:column;min-height:0">
  <div class="form-body">
    <div class="field"><label for="ns">Assunto</label>
      ${catalog.subjects.length
        ? `<select class="inp" id="ns" required><option value="" disabled selected>Selecione o assunto conforme a mensagem…</option>${catalog.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`
        : `<select class="inp" id="ns" required disabled><option value="">Nenhum assunto cadastrado</option></select><p class="note">${isAdmin()?'Cadastre os assuntos em “Cadastros”.':'A administradora precisa cadastrar os assuntos.'}</p>`}
    </div>
    <div class="two">
      <div class="field"><label for="nt">Tipo</label>${catalog.types.length ? `<select class="inp" id="nt" required>${catalog.types.map(t=>`<option>${esc(t)}</option>`).join('')}</select>` : `<select class="inp" id="nt" required disabled><option value="">Nenhum tipo cadastrado</option></select><p class="note">${isAdmin()?'Cadastre os tipos em “Cadastros”.':'A administradora precisa cadastrar os tipos.'}</p>`}</div>
      <div class="field"><label for="ncity">Cidade da ocorrência <span style="font-weight:400">(opcional)</span></label><select class="inp" id="ncity"><option value="">Não informada</option>${catalog.cities.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <div class="two">
      <div class="field"><label for="nk">Contato de quem enviou</label><input class="inp" id="nk" placeholder="Nome ou telefone" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="nd">Data e hora da mensagem</label><input class="inp" id="nd" type="datetime-local" value="${nowLocal()}" required></div>
    </div>
    <div class="field"><label for="nm">Mensagem do cliente</label><textarea class="inp" id="nm" maxlength="2000" placeholder="Cole ou digite a mensagem recebida…"></textarea></div>
    <div class="chips" id="nchips"></div>
  </div>
  <div class="m-foot" style="align-items:center">
    <button class="iconbtn" type="button" id="nclip" title="Anexar arquivo" aria-label="Anexar arquivo">${ic('clip')}</button>
    <input type="file" id="nfile" accept="${ACCEPT}" multiple hidden>
    <span style="flex:1"></span>
    <button class="btn" type="button" data-c>Cancelar</button><button class="btn primary" type="submit" id="nsave">Registrar chamado</button>
  </div></form>`);
  o._close = () => o.remove();
  o.querySelectorAll('.x,[data-c]').forEach(b=>b.onclick=o._close);
  const chips = () => { $('#nchips',o).innerHTML = chipsHTML(pending); };
  $('#nclip',o).onclick = () => $('#nfile',o).click();
  $('#nfile',o).onchange = async e => { pending.push(...await prepFiles(e.target.files)); e.target.value=''; chips(); };
  $('#nchips',o).onclick = e => { const b=e.target.closest('[data-rm]'); if(b){ pending.splice(+b.dataset.rm,1); chips(); } };
  $('#nf',o).onsubmit = async e => {
    e.preventDefault();
    const text = $('#nm',o).value.trim();
    if(!$('#nt',o).value){ toast('Cadastre ao menos um tipo em Cadastros.'); return; }
    if(!text && !pending.length){ toast('Digite a mensagem ou anexe um arquivo.'); return; }
    const btn = $('#nsave',o); btn.disabled = true; btn.textContent = 'Registrando…';
    try{
      const id = await store.next();
      for(const a of pending) await store.putFile(a.id, {name:a.name, type:a.type, size:a.size, data:a.data});
      const at = new Date($('#nd',o).value).toISOString();
      const contact = $('#nk',o).value.trim();
      await store.setTicket({ id, city:$('#ncity',o).value, type:$('#nt',o).value, subject:$('#ns',o).value, contact,
        status:'aberto', createdAt:new Date().toISOString(), createdBy:me.user, lastMessageAt:at, lastPreview:(text||('Anexo: '+pending[0].name)).slice(0,90), lastSide:'client' });
      await store.addMessage(id, { side:'client', author:contact, at, text, files:pending.map(({id,name,type,size})=>({id,name,type,size})) });
      o.remove(); toast(`Chamado ${id} registrado.`);
    }catch(err){ btn.disabled=false; btn.textContent='Registrar chamado'; toast(err.message || 'Não foi possível registrar. Tente de novo.'); }
  };
  setTimeout(()=>$('#ns',o).focus(),30);
}

/* ───────── detalhe do chamado ───────── */
function headHTML(t){
  return `<div class="tags"><span class="pill type-${TYPE_SLUG[t.type]||'duvida'}">${esc(t.type)}</span><span class="pill st st-${t.status}">${STATUS[t.status]}</span></div>
  <h2>${esc(t.subject)}</h2>
  <div class="meta"><span class="proto">${esc(t.id)}</span>${t.city?` · ${esc(t.city)}`:''} · Registrado em ${dmyhm(t.createdAt)}${t.createdBy?` por ${esc(t.createdBy)}`:''}${t.contact?` · Contato: ${esc(t.contact)}`:''}</div>
  <p class="note" style="display:none" id="dWppNote">Atendimento registrado via WhatsApp — o relato do cliente é registrado uma única vez, na abertura do chamado; as atualizações seguintes são feitas por quem está atendendo.</p>
  <div class="no-print" style="margin-top:8px;display:flex;gap:18px;flex-wrap:wrap"><button class="linkbtn" id="dLink">Copiar link do chamado</button><button class="linkbtn" id="dPrint">Exportar em PDF</button>${me.role==='admin' ? `<button class="linkbtn" id="dDel" style="color:var(--red)">Excluir chamado</button>` : ''}</div>
  <button class="x no-print" aria-label="Fechar">${ic('x')}</button>`;
}
function openTicket(id){
  const t = tickets.find(x=>x.id===id); if(!t) return;
  if(open){ open.unsub?.(); open.o.remove(); open = null; }
  const o = layer(`<div class="m-head" id="dHead"></div><div class="m-body" id="dBody" aria-live="polite"></div>
  <div class="composer no-print" id="dComp"></div>`);
  open = { id, o, msgs:[], pending:[], clientMode:false };
  o._close = () => { open?.unsub?.(); open=null; o.remove(); };
  renderHead(); renderComposer();
  open.unsub = store.watchMessages(id, list => { open.msgs = list.sort((a,b)=>String(a.at).localeCompare(String(b.at))); renderMsgs(true); });
}
function refreshOpenHead(){ if(open){ const t = tickets.find(x=>x.id===open.id); if(!t){ open.o._close(); return; } renderHead(); renderComposer(true); } }
function renderHead(){
  const t = tickets.find(x=>x.id===open.id); const h = $('#dHead', open.o); h.innerHTML = headHTML(t);
  h.querySelector('.x').onclick = open.o._close;
  $('#dLink', open.o).onclick = () => copyLink(t.id);
  $('#dPrint', open.o).onclick = () => exportChamadoPDF(t, open.msgs);
  const d = $('#dDel', open.o);
  if(d) d.onclick = () => confirmClick(d, 'Confirmar exclusão?', async () => { try{ await store.delTicket(t.id); open.o._close(); toast('Chamado excluído.'); }catch(_){ toast('Não foi possível excluir.'); } });
}
function renderMsgs(scroll){
  const body = $('#dBody', open.o); let last = ''; let html = '';
  for(const m of open.msgs){
    const day = dmy(m.at);
    if(day !== last){ html += `<div class="sep">${day}</div>`; last = day; }
    if(m.side==='system'){ html += `<div class="sys">${esc(m.text)} · ${dm(m.at)}</div>`; continue; }
    const canDel = m.side==='staff' && (me.role==='admin' || m.author===me.user);
    html += `<div class="msg ${m.side}"><div class="meta">${esc(m.author)} · ${dm(m.at)}${canDel?`<button class="del" data-del="${esc(m.id)}">Apagar</button>`:''}</div>
      <div class="bubble">${esc(m.text)}${attsHTML(m.files)}</div></div>`;
  }
  const stick = scroll && (body.scrollHeight - body.scrollTop - body.clientHeight < 120 || !body.dataset.init);
  body.innerHTML = html; body.dataset.init='1';
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmClick(b, 'Confirmar?', async () => {
    const m = open.msgs.find(x => String(x.id) === b.dataset.del), t = tickets.find(x => x.id === open.id);
    await store.delMessage(open.id, b.dataset.del);
    if(m && t && (t.repliesBy||{})[m.author] > 0){ try{ await store.patchTicket(t.id, { repliesBy:{ ...t.repliesBy, [m.author]: t.repliesBy[m.author] - 1 } }); }catch(_){} }
  }));
  hydrateImages(body, open.msgs.flatMap(m=>m.files||[]));
  if(stick) body.scrollTop = body.scrollHeight;
}
function renderComposer(soft){
  const t = tickets.find(x=>x.id===open.id); const c = $('#dComp', open.o);
  const closed = t.status==='encerrado';
  const key = closed + '|' + t.status;
  if(soft && c.dataset.closed === key) return;      // preserva o rascunho quando nada mudou
  c.dataset.closed = key;
  const draft = $('#rt', c)?.value || '';
  c.innerHTML = `
    ${open.clientMode && !closed ? `<div class="client-mode"><div class="two"><div class="field" style="margin:0"><label for="rk">Contato</label><input class="inp" id="rk" value="${esc(t.contact||'')}"></div><div class="field" style="margin:0"><label for="rd">Data e hora</label><input class="inp" id="rd" type="datetime-local" value="${nowLocal()}"></div></div></div>`:''}
    <textarea class="inp" id="rt" maxlength="2000" ${closed?'disabled':''} placeholder="${closed?(isAdmin()?'Chamado encerrado. Reabra para responder.':'Chamado encerrado.'):(open.clientMode?'Mensagem recebida do cliente…':'Resposta… (Ctrl+Enter para enviar)')}" aria-label="Resposta"></textarea>
    <div class="chips" id="rchips"></div>
    <div class="c-actions">
      ${closed ? (isAdmin() ? `<button class="btn" id="rReopen">Reabrir chamado</button>` : `<span class="note">Somente a administradora pode reabrir este chamado.</span>`) : `${t.status==='analise' ? `<button class="btn" id="rResume">Retomar atendimento</button>` : `<button class="btn" id="rAnalise">Colocar em análise</button>`}<button class="btn" id="rClose">Encerrar chamado</button>`}
      <button class="iconbtn" id="rclip" type="button" title="Anexar arquivo" aria-label="Anexar arquivo" ${closed?'disabled':''}>${ic('clip')}</button>
      <input type="file" id="rfile" accept="${ACCEPT}" multiple hidden>
      ${closed?'':`<button class="linkbtn" id="rMode">${open.clientMode?'Voltar a responder':'Registrar mensagem do cliente'}</button>`}
      <span class="sp"></span><span class="count" id="rcount">0/2000</span>
      <button class="btn primary" id="rSend" disabled>${open.clientMode?'Registrar':'Responder'} →</button>
    </div>`;
  const ta = $('#rt',c), send = $('#rSend',c);
  ta.value = draft;
  const upd = () => { $('#rcount',c).textContent = ta.value.length+'/2000'; send.disabled = closed || (!ta.value.trim() && !open.pending.length); };
  const chips = () => { $('#rchips',c).innerHTML = chipsHTML(open.pending); upd(); };
  ta.oninput = upd; chips();
  ta.onkeydown = e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && !send.disabled){ e.preventDefault(); doSend(); } };
  $('#rclip',c).onclick = () => $('#rfile',c).click();
  $('#rfile',c).onchange = async e => { open.pending.push(...await prepFiles(e.target.files)); e.target.value=''; chips(); };
  $('#rchips',c).onclick = e => { const b=e.target.closest('[data-rm]'); if(b){ open.pending.splice(+b.dataset.rm,1); chips(); } };
  $('#rMode',c) && ($('#rMode',c).onclick = () => { open.clientMode = !open.clientMode; renderComposer(); $('#rt',c).focus(); });
  $('#rClose',c) && ($('#rClose',c).onclick = () => changeStatus('encerrado', `Chamado encerrado por ${me.user}`));
  $('#rAnalise',c) && ($('#rAnalise',c).onclick = () => changeStatus('analise', `Chamado colocado em análise por ${me.user}`));
  $('#rResume',c) && ($('#rResume',c).onclick = () => changeStatus('atendimento', `Atendimento retomado por ${me.user}`));
  $('#rReopen',c) && ($('#rReopen',c).onclick = () => changeStatus('atendimento', `Chamado reaberto por ${me.user}`));
  send.onclick = doSend;
  async function doSend(){
    const text = ta.value.trim(); if(!text && !open.pending.length) return;
    send.disabled = true;
    const id = open.id, t = tickets.find(x=>x.id===id), client = open.clientMode;
    try{
      const files = open.pending; for(const a of files) await store.putFile(a.id, {name:a.name, type:a.type, size:a.size, data:a.data});
      const at = client ? new Date($('#rd',c).value || Date.now()).toISOString() : new Date().toISOString();
      await store.addMessage(id, { side: client?'client':'staff', author: client ? ($('#rk',c).value.trim() || t.contact || 'Cliente') : me.user, at, text, files:files.map(({id,name,type,size})=>({id,name,type,size})) });
      const patch = { lastMessageAt:at, lastPreview:(text||('Anexo: '+files[0].name)).slice(0,90), lastSide: client?'client':'staff' };
      if(!client && t.status==='aberto') patch.status = 'atendimento';
      if(!client) patch.repliesBy = { ...(t.repliesBy||{}), [me.user]: ((t.repliesBy||{})[me.user]||0) + 1 };
      await store.patchTicket(id, patch);
      open.pending = []; ta.value = ''; chips();
    }catch(_){ toast('Não foi possível enviar. Tente de novo.'); upd(); }
  }
}
async function changeStatus(status, note){
  const cur = tickets.find(x => x.id === open.id);
  if(status==='atendimento' && cur?.status==='encerrado' && !isAdmin()){ toast('Somente a administradora pode reabrir chamados.'); return; }
  const id = open.id; const now = new Date().toISOString();
  try{
    await store.addMessage(id, { side:'system', author:me.user, at:now, text:note, files:[] });
    await store.patchTicket(id, status==='encerrado' ? { status, closedBy:me.user, closedAt:now } : { status, closedBy:null, closedAt:null });
  }
  catch(_){ toast('Não foi possível alterar o status.'); }
}

/* ───────── início ───────── */
(async function boot(){
  pendingOpen = readHash(); if(pendingOpen) setPending(pendingOpen);
  const { data:{ session } } = await sb.auth.getSession();
  let rec = null;
  if(session?.user?.email){
    const u = session.user.email.split('@')[0];
    try{ rec = await store.getUser(u); }catch(_){ rec = null; }
  }
  if(rec && rec.disabled){ await sb.auth.signOut(); rec = null; }
  if(rec){ me = { user:rec.user, name:rec.name, role:rec.role }; start(); } else viewLogin();
})();
setInterval(() => { if(me && $('#rows')) renderList(); }, 60000);
</script>
